name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Start MySQL Database via Docker Compose
      run: docker compose -f docker/docker-compose.yml up -d
      
    - name: Wait for MySQL to be ready
      run: |
        echo "Waiting for MySQL to start..."
        while ! mysqladmin ping -h 127.0.0.1 -P 3307 -u root -proot --silent; do
          sleep 1
        done
        echo "MySQL is up and running!"

    - name: Run Tests
      env:
        DB_PORT: 3307
        DB_USER: root
        DB_PASSWORD: root
        DB_NAME: mcp_test_db
      run: npm test
